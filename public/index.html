<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>minimi · agent</title>
<style>
  :root {
    --bg: #0b0b0c;
    --panel: #141416;
    --panel-2: #19191c;
    --line: #26262b;
    --text: #ececef;
    --muted: #8b8b93;
    --accent: #e8c07d;
    --accent-dim: #3a2f1f;
    --danger: #f28b82;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 ui-sans-serif, -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    background: rgba(11, 11, 12, 0.9);
    backdrop-filter: blur(8px);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 600; letter-spacing: 0.2px; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px rgba(232, 192, 125, 0.55);
  }
  .brand span.muted { font-weight: 400; }
  .right { display: flex; align-items: center; gap: 14px; }
  .muted { color: var(--muted); font-size: 12.5px; }
  button.ghost {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 11px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  button.ghost:hover { border-color: #3a3a41; background: var(--panel); }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 28px 20px 120px;
    scroll-behavior: smooth;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  .empty { color: var(--muted); margin-top: 18vh; text-align: center; }
  .empty h1 { color: var(--text); font-size: 19px; font-weight: 600; margin: 0 0 10px; }
  .empty p { margin: 6px 0; font-size: 14px; }
  .empty code {
    color: var(--accent);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 1px 6px;
    font-size: 12.5px;
  }
  .msg { margin: 0 0 26px; }
  .role {
    font-size: 11px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 7px;
  }
  .bubble { white-space: pre-wrap; word-wrap: break-word; }
  .msg.user .bubble {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 11px 14px;
    display: inline-block;
    max-width: 88%;
  }
  .msg.assistant .bubble { color: #e6e6ea; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 9px; }
  .chip {
    font-size: 11.5px;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px 9px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .chip .led { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
  .sources { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
  .sources .label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 7px; }
  .sources ol { margin: 0; padding-left: 18px; }
  .sources li { font-size: 12.8px; margin-bottom: 4px; }
  .sources a { color: var(--accent); text-decoration: none; }
  .sources a:hover { text-decoration: underline; }
  .sources .from { color: var(--muted); }
  form {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    padding: 16px 20px 22px;
    background: linear-gradient(180deg, rgba(11,11,12,0) 0%, var(--bg) 42%);
  }
  .composer {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 9px 10px 9px 15px;
  }
  .composer:focus-within { border-color: #3d3d45; }
  textarea {
    flex: 1;
    resize: none;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--text);
    font: inherit;
    line-height: 1.55;
    padding: 6px 0;
    max-height: 180px;
  }
  textarea::placeholder { color: #6c6c74; }
  button.send {
    background: var(--accent);
    color: #1a1408;
    border: 0;
    border-radius: 10px;
    padding: 8px 15px;
    font: inherit;
    font-weight: 600;
    font-size: 13.5px;
    cursor: pointer;
  }
  button.send:disabled { opacity: 0.45; cursor: default; }
  .thinking { display: inline-flex; gap: 4px; padding: 3px 0; }
  .thinking i {
    width: 5px; height: 5px; border-radius: 50%; background: var(--muted);
    animation: pulse 1.1s infinite ease-in-out;
  }
  .thinking i:nth-child(2) { animation-delay: 0.16s; }
  .thinking i:nth-child(3) { animation-delay: 0.32s; }
  @keyframes pulse { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
  .error { color: var(--danger); }
  @media (max-width: 640px) {
    main { padding: 20px 14px 110px; }
    header { padding: 12px 14px; }
    form { padding: 12px 14px 16px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span> minimi <span class="muted">/ agent</span></div>
  <div class="right">
    <span id="status" class="muted">connecting…</span>
    <button class="ghost" id="newChat">New chat</button>
  </div>
</header>

<main id="chat"><div class="wrap" id="thread">
  <div class="empty" id="empty">
    <h1>One tool. A memory with dates.</h1>
    <p>Ask something that changes, or ask what you asked before.</p>
    <p><code>What did I ask you on 3 November?</code></p>
    <p><code>Last Tuesday I asked about Postgres hosting — has pricing changed?</code></p>
  </div>
</div></main>

<form id="composer">
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Ask anything…" autocomplete="off"></textarea>
    <button class="send" id="send" type="submit">Send</button>
  </div>
</form>

<script>
  const chat = document.getElementById("chat");
  const thread = document.getElementById("thread");
  const empty = document.getElementById("empty");
  const form = document.getElementById("composer");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const statusEl = document.getElementById("status");
  const newChatBtn = document.getElementById("newChat");

  const SESSION_KEY = "minimi.session";
  let sessionId = localStorage.getItem(SESSION_KEY);
  if (!sessionId) {
    sessionId = crypto.randomUUID();
    localStorage.setItem(SESSION_KEY, sessionId);
  }
  let busy = false;

  fetch("/health")
    .then((r) => r.json())
    .then((h) => {
      statusEl.textContent = h.llmKey ? `${h.model} · ${h.search}` : "no LLM_API_KEY";
      if (!h.llmKey) statusEl.style.color = "#f28b82";
    })
    .catch(() => { statusEl.textContent = "offline"; });

  function scrollDown() { chat.scrollTop = chat.scrollHeight; }

  function addMessage(role) {
    empty?.remove();
    const msg = document.createElement("div");
    msg.className = `msg ${role}`;
    const tag = document.createElement("div");
    tag.className = "role";
    tag.textContent = role === "user" ? "you" : "minimi";
    const chips = document.createElement("div");
    chips.className = "chips";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    msg.append(tag, chips, bubble);
    thread.appendChild(msg);
    scrollDown();
    return { msg, chips, bubble };
  }

  function addChip(chips, text, led = true) {
    const chip = document.createElement("span");
    chip.className = "chip";
    if (led) {
      const dot = document.createElement("span");
      dot.className = "led";
      chip.appendChild(dot);
    }
    chip.appendChild(document.createTextNode(text));
    chips.appendChild(chip);
  }

  function renderSources(msg, list) {
    const box = document.createElement("div");
    box.className = "sources";
    const label = document.createElement("div");
    label.className = "label";
    label.textContent = `${list.length} source${list.length === 1 ? "" : "s"}`;
    const ol = document.createElement("ol");
    for (const s of list) {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = s.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = s.title || s.url;
      li.appendChild(a);
      try {
        const host = document.createElement("span");
        host.className = "from";
        host.textContent = ` — ${new URL(s.url).hostname.replace(/^www\./, "")}`;
        li.appendChild(host);
      } catch {}
      ol.appendChild(li);
    }
    box.append(label, ol);
    msg.appendChild(box);
    scrollDown();
  }

  function setBusy(value) {
    busy = value;
    sendBtn.disabled = value;
  }

  async function send(message) {
    if (!message || busy) return;
    setBusy(true);
    addMessage("user").bubble.textContent = message;
    const { msg, chips, bubble } = addMessage("assistant");

    const thinking = document.createElement("span");
    thinking.className = "thinking";
    thinking.innerHTML = "<i></i><i></i><i></i>";
    bubble.appendChild(thinking);

    let firstToken = true;
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ sessionId, message }),
      });
      if (!res.ok || !res.body) {
        const detail = await res.json().catch(() => ({}));
        throw new Error(detail.error || `HTTP ${res.status}`);
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      const handle = (event) => {
        if (event.type === "token") {
          if (firstToken) {
            bubble.textContent = "";
            firstToken = false;
          }
          bubble.textContent += event.text;
          scrollDown();
        } else if (event.type === "tool") {
          addChip(chips, `${event.recheck ? "re-checked" : "searched"}: ${event.query} · ${event.results} result${event.results === 1 ? "" : "s"}`);
        } else if (event.type === "memory") {
          addChip(chips, `recalled ${event.count} turn${event.count === 1 ? "" : "s"} · ${event.dates.join(", ")}`);
        } else if (event.type === "sources") {
          renderSources(msg, event.sources);
        } else if (event.type === "error") {
          bubble.classList.add("error");
          bubble.textContent = event.message;
        }
      };

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let cut;
        while ((cut = buffer.indexOf("\n\n")) >= 0) {
          const frame = buffer.slice(0, cut);
          buffer = buffer.slice(cut + 2);
          const line = frame.split("\n").find((l) => l.startsWith("data: "));
          if (!line) continue;
          try { handle(JSON.parse(line.slice(6))); } catch {}
        }
      }
    } catch (error) {
      bubble.classList.add("error");
      bubble.textContent = error instanceof Error ? error.message : String(error);
    } finally {
      if (firstToken && bubble.querySelector(".thinking")) {
        bubble.textContent = "";
      }
      setBusy(false);
      input.focus();
      scrollDown();
    }
  }

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    input.value = "";
    input.style.height = "auto";
    void send(message);
  });

  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      form.requestSubmit();
    }
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = `${Math.min(input.scrollHeight, 180)}px`;
  });

  newChatBtn.addEventListener("click", () => {
    sessionId = crypto.randomUUID();
    localStorage.setItem(SESSION_KEY, sessionId);
    thread.replaceChildren();
    const fresh = document.createElement("div");
    fresh.className = "empty";
    fresh.innerHTML = "<h1>Fresh session.</h1><p>This agent will not remember the last one — memory is scoped to the session file.</p>";
    thread.appendChild(fresh);
  });

  input.focus();
</script>
</body>
</html>
